# OpenOrca dev data plane — TypeDB v3 (context graph) + Postgres (LangGraph checkpointer, V19).
# Cluster-side infra (kind + ArgoCD + Rollouts) is installed by OO-001 scripts, NOT here.
# Run: docker compose --env-file versions.env up -d
name: openorca-dev

services:
  typedb:
    image: typedb/typedb:${TYPEDB_VERSION:-3.12.3}
    container_name: openorca-typedb
    ports:
      - "127.0.0.1:1729:1729"   # gRPC (drivers)
      - "127.0.0.1:8000:8000"   # HTTP v1 (agent tools — see context/kits/kit-agent-tools.md)
    restart: unless-stopped
    # Persistence OFF by default (dev = ephemeral; dev-down = full reset).
    # To persist across restarts, mount the arch-specific data dir + uncomment the volume:
    #   arm64 (Apple Silicon): /opt/typedb-server-linux-arm64/server/data
    #   x86_64:                /opt/typedb-server-linux-x86_64/server/data
    # volumes:
    #   - typedb-data:/opt/typedb-server-linux-arm64/server/data

  postgres:
    image: postgres:${POSTGRES_VERSION:-18.4-alpine}
    container_name: openorca-checkpointer
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: openorca
      POSTGRES_PASSWORD: openorca-dev   # dev only — never used outside localhost; prod uses a secret manager
      POSTGRES_DB: openorca_checkpoints
    restart: unless-stopped
    # Persistence OFF by default (dev = ephemeral; matches TypeDB above). Uncomment to persist:
    # volumes:
    #   - postgres-data:/var/lib/postgresql/18/docker   # PG18+ path is version-scoped

# volumes:
#   typedb-data:
#   postgres-data:
#
# Default dev credentials: TypeDB admin/password, Postgres openorca/openorca-dev. TLS off (localhost only).
