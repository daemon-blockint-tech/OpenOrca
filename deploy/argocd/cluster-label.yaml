# Label generator selector butuh Cluster secret ber-label — in-cluster bawaan ArgoCD
# tidak punya label. Secret ini mendeklarasikan cluster yang sama (kubernetes.default.svc)
# dgn label openorca.io/fleet=true supaya generator `clusters` match (V10).
apiVersion: v1
kind: Secret
metadata:
  name: openorca-fleet-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    openorca.io/fleet: "true"
stringData:
  name: openorca-kind
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig":{"insecure":false}}
