# AppProject openorca — batas project utk fleet ter-manage (kit-fleet.md §AppProject).
# Namespace-scoped only; ⊥ cluster resource.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: openorca
  namespace: argocd
spec:
  description: OpenOrca-managed fleet
  sourceRepos:
    - https://github.com/daemon-blockint-tech/openorca-fleet.git
  destinations:
    - server: "*"
      namespace: "svc-*"
  # Namespace di-whitelist karena CreateNamespace=true membuatnya sbg bagian sync
  # (ditemukan live T10: [] memblokir → "resource :Namespace is not permitted").
  # Selain itu tetap cluster-scoped only.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
